<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
<title id="title">3F美術室 エアコン交換前後の正面・側面寸法比較</title>
<desc id="desc">灰色破線は旧日立、青色は新パナソニック。室内機は幅と高さが同じで奥行80mm減。室外機は幅144mm、高さ90mm、奥行24mm減。本体寸法の同一縮尺比較。</desc>
<rect width="1100" height="1100" fill="#fff"/>
<style>text{font-family: sans-serif;fill:#172b43}.h{font-size:26px;font-weight:bold}.sub{font-size:18px}.label{font-size:17px}.old{fill:#64748b;fill-opacity:.08;stroke:#64748b;stroke-width:3;stroke-dasharray:9 6}.new{fill:#0ea5e9;fill-opacity:.16;stroke:#0284c7;stroke-width:3}</style>
<text x="40" y="44" class="h">3F 美術室｜エアコンの大きさの変化</text>
<text x="40" y="78" class="sub">旧：日立 RAS-ZC40D2 ／ 新：Panasonic CS-366DEX-W</text>
<path d="M40 108h55" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6"/>
<path d="M390 108h55" stroke="#0284c7" stroke-width="3"/>
<text x="105" y="114" class="label">旧：灰色の破線</text>
<text x="455" y="114" class="label">新：青色の実線</text>
<text x="40" y="150" class="label">全図同一縮尺：1 mm = 0.55図内単位。突起・配管・据付余白は含めない。</text>
