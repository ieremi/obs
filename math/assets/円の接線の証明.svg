<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" role="img" aria-labelledby="title desc">
  <title id="title">接線が半径に垂直でないと仮定したときの矛盾</title>
  <desc id="desc">中心 O から直線 ℓ へ下ろした垂線の足 H が円上の点 P と異なると仮定する。P を H に関して対称移動した P′ も円上にあるため、直線は円と二点で交わり、接線にはならない。</desc>
  <rect width="660" height="400" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="17" fill="#172b4d">
    <text x="28" y="33" font-size="21" font-weight="bold">H ≠ P とすると、もう一つの交点ができる</text>
    <circle cx="185" cy="205" r="120" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M30 133H345" stroke="#075985" stroke-width="3"/>
    <path d="M185 205V133" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M89 133 185 205 281 133" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M185 145H197V133" fill="none" stroke="#172b4d" stroke-width="1.6"/>
    <path d="M134 128v10 M230 128v10" stroke="#172b4d" stroke-width="2"/>
    <g fill="#172b4d"><circle cx="185" cy="205" r="4"/><circle cx="185" cy="133" r="4"/><circle cx="89" cy="133" r="4"/><circle cx="281" cy="133" r="4"/></g>
    <text x="173" y="231">O</text><text x="177" y="119">H</text>
    <text x="66" y="119">P′</text><text x="280" y="119">P</text>
    <text x="351" y="139" fill="#075985">ℓ</text>
    <text x="389" y="190">HP′ = HP</text>
    <text x="389" y="225">OP′² = OH² + HP′²</text>
    <text x="431" y="255">= OP² = r²</text>
    <text x="389" y="291" font-weight="bold">P′ も円上にある。</text>
    <text x="28" y="362" font-size="15" fill="#475569">この図の ℓ は接線ではない。接線なら H = P でなければならない。</text>
  </g>
</svg>
