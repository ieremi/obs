<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" role="img" aria-labelledby="title desc">
  <title id="title">円の接線は接点への半径に垂直</title>
  <desc id="desc">円 x²+y²=r² と円上の接点 P(x₁,y₁)、その接線。中心 C から P への半径と接線は垂直。接線上の別の点 Q は円の外にある。</desc>
  <rect width="660" height="460" rx="12" fill="#fff"/>
  <g font-family="sans-serif" font-size="17" fill="#172b4d">
    <text x="28" y="32" font-size="21" font-weight="bold">接点を通り、半径に垂直な直線</text>
    <path d="M35 250H540 M210 420V60" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
    <path d="m540 250-8-4v8z M210 60l-4 8h8z" fill="#94a3b8"/>
    <text x="548" y="256">x</text><text x="218" y="68">y</text>
    <circle cx="210" cy="250" r="150" fill="#eff6ff" fill-opacity="0.7" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M150 17.5 500 280" stroke="#075985" stroke-width="3"/>
    <path d="M210 250 300 130" stroke="#2563eb" stroke-width="3"/>
    <path d="M210 250 420 220" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M292.8 139.6 302.4 146.8 309.6 137.2" fill="none" stroke="#172b4d" stroke-width="1.7"/>
    <g fill="#172b4d"><circle cx="210" cy="250" r="4"/><circle cx="300" cy="130" r="4"/><circle cx="420" cy="220" r="4"/></g>
    <text x="137" y="277">O(0,0)</text>
    <text x="309" y="114">P(x₁,y₁)</text>
    <text x="428" y="210">Q</text>
    <text x="222" y="186" fill="#2563eb">r</text>
    <text x="413" y="148" fill="#075985">接線 ℓ</text>
    <text x="413" y="173" fill="#075985">x₁x + y₁y = r²</text>
    <text x="350" y="335">OP ⟂ PQ</text>
    <text x="350" y="365">OQ² = OP² + PQ²</text>
    <text x="350" y="393">Q ≠ P なら OQ &gt; r</text>
    <text x="28" y="439" font-size="15" fill="#475569">円と接線の共有点は P だけ。</text>
  </g>
</svg>
